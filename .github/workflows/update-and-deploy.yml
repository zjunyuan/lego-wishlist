name: Update data and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 18 * * *' # 2:17am Singapore time
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run tests
        run: node --test 'scripts/*.test.mjs'
      - name: Update catalogue
        continue-on-error: true
        run: node scripts/update-data.mjs
      - name: Save updated data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data
          git diff --cached --quiet || { git commit -m 'Update catalogue [skip ci]' && git push; }
      - name: Prepare site
        run: |
          mkdir _site
          cp -r index.html css js data _site/
          # Tie each deploy's files together so browsers never mix old and new code.
          sed -i -E "s#(['\"])\./([a-z-]+\.js)\1#\1./\2?v=${GITHUB_SHA}\1#g" _site/js/*.js
          sed -i -E "s#(css/style\.css|js/app\.js)#\1?v=${GITHUB_SHA}#g" _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
